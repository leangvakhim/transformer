<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding RAG for Kids (and Adults!)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX for Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        xintegrity="sha384-n8MVd4RsJOPaH4zfc123yefO/4vta1ivwp01bgTtvG+Ea8zW+sJ+04O9EieU2zaw" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        xintegrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Gl1m2VnZ0Qz3jZ3Y8213Yl/f1W+rLw9sL8aezw/k"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        xintegrity="sha384-+VBxd3r6XgURycqtZ117nYw44OcwXbn3F3Brs42QzUN28O1yW1s4hX3Ua6Iq1vX"
        crossorigin="anonymous"></script>

    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom scrollbar for content area */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div
        class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl flex flex-col overflow-hidden h-[90vh] md:h-[80vh] border border-slate-200">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-6 text-center shrink-0 shadow-md z-10">
            <h1 class="text-2xl md:text-3xl font-extrabold flex items-center justify-center gap-3">
                <span>🤖</span> Understanding RAG <span>📚</span>
            </h1>
            <p class="text-indigo-200 text-sm md:text-base mt-2 font-medium">Retrieval-Augmented Generation (Explained
                like you're 7!)</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2 shrink-0">
            <div id="progress-bar" class="bg-emerald-400 h-2 transition-all duration-300 ease-out" style="width: 0%;">
            </div>
        </div>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="flex-grow p-6 md:p-10 overflow-y-auto custom-scrollbar bg-slate-50 relative">
            <!-- Content gets injected here by JS -->
        </div>

        <!-- Footer / Navigation Controls -->
        <div class="bg-white p-4 md:p-6 border-t border-slate-200 flex justify-between items-center shrink-0">
            <button id="btn-back"
                class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2">
                <span>&larr;</span> Back
            </button>

            <div class="flex gap-2" id="dot-indicators">
                <!-- Dots injected via JS -->
            </div>

            <button id="btn-next"
                class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2">
                Next <span>&rarr;</span>
            </button>
        </div>
    </div>

    <script src="../js/rag.js"></script>
</body>

</html>
