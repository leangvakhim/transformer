<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformer Concepts Visualized</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        /* Custom animation for smooth step transitions */
        .slide-fade-in {
            animation: slideFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes slideFadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* KaTeX display mode override to prevent scrollbars when not needed */
        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 10px 0;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen font-sans flex items-center justify-center p-4 sm:p-8">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col min-h-[650px] relative">

        <!-- Progress Bar -->
        <div class="h-2 bg-slate-100 w-full absolute top-0 left-0">
            <div id="progress-bar" class="h-full bg-indigo-500 transition-all duration-500 ease-in-out w-0"></div>
        </div>

        <!-- Header -->
        <header class="pt-8 px-8 pb-4 border-b border-slate-100 flex justify-between items-end">
            <div>
                <span class="text-sm font-bold tracking-wider text-indigo-500 uppercase"
                    id="concept-label">Introduction</span>
                <h1 class="text-3xl font-extrabold text-slate-800 mt-1" id="step-title">Transformers Visualized</h1>
            </div>
            <div class="text-slate-400 font-medium text-sm mb-1" id="step-counter">
                Step 1 of 12
            </div>
        </header>

        <!-- Content Area -->
        <main class="flex-grow p-8 overflow-y-auto" id="content-container">
            <div id="step-content" class="slide-fade-in text-lg text-slate-700 leading-relaxed space-y-6">
                <!-- Content injected via JS -->
            </div>
        </main>

        <!-- Footer Navigation -->
        <footer class="bg-slate-50 p-6 border-t border-slate-200 flex justify-between items-center mt-auto">
            <button id="prev-btn"
                class="px-6 py-3 rounded-lg font-semibold text-slate-600 bg-white border border-slate-300 shadow-sm hover:bg-slate-50 hover:text-slate-900 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                Back
            </button>
            <button id="next-btn"
                class="px-6 py-3 rounded-lg font-semibold text-white bg-indigo-600 shadow-md shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 flex items-center gap-2">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m9 18 6-6-6-6" />
                </svg>
            </button>
        </footer>
    </div>

    <script src="../js/core_equation.js"></script>
</body>

</html>
