<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Detective - Transformer Visualization</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS and JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        /* Custom animation for smooth step transitions */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .math-container {
            font-size: 1.125rem;
            margin: 1rem 0;
            padding: 1rem;
            background-color: #f8fafc;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            text-align: center;
            overflow-x: auto;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="max-w-3xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[800px] sm:h-[700px]">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-6 text-center">
            <h1 class="text-2xl sm:text-3xl font-bold flex items-center justify-center gap-3">
                <span>🤖</span> Robot Detective
            </h1>
            <p class="text-indigo-200 mt-2">How a computer guesses the next word!</p>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 p-6 sm:p-8 overflow-y-auto relative" id="content-area">
            <!-- Step content will be injected here by JavaScript -->
        </div>

        <!-- Footer / Controls -->
        <div class="bg-slate-50 border-t border-slate-200 p-4 sm:p-6 flex items-center justify-between">
            <button id="btn-back"
                class="px-5 py-2.5 rounded-lg font-semibold text-slate-600 bg-white border border-slate-300 shadow-sm hover:bg-slate-50 hover:text-indigo-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; Back
            </button>

            <!-- Step Indicators -->
            <div class="flex gap-2" id="step-indicators">
                <!-- Dots injected by JS -->
            </div>

            <button id="btn-next"
                class="px-5 py-2.5 rounded-lg font-semibold text-white bg-indigo-600 shadow-sm hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Next &rarr;
            </button>
        </div>
    </div>

    <script src="../js/output_generation.js"></script>
</body>

</html>
