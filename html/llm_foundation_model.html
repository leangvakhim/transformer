<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building LLMs: Foundation Models</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX for LaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
        xintegrity="sha384-GvrOXuhMATgEsSwCs4smul74iXGOixntILdUW9XmUC6+HX0sLNAK3q71bZ4Feq/m" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
        xintegrity="sha384-cpW21h6RZv/phavutF+AuVYrr+dA8xD9zs6FwLpaCct6O9ctzYFfLe4lxJq28001"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        xintegrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbOxyj0O1rxVqTGbT099cSyaEx"
        crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom animation for the guessing game step */
        .typing-box {
            display: inline-block;
            padding: 0.5rem 1rem;
            margin: 0.25rem;
            background-color: #e2e8f0;
            border-radius: 0.5rem;
            font-weight: 500;
            color: #334155;
        }

        .guessing-box {
            background-color: #3b82f6;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div
        class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-3xl w-full overflow-hidden flex flex-col min-h-[600px]">

        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl md:text-3xl font-bold">Building AI: Foundation Models</h1>
            <p class="text-indigo-200 mt-2 text-sm md:text-base">Step 1 of creating a smart assistant</p>
        </div>

        <!-- Dynamic Content Area -->
        <div class="p-6 md:p-8 flex-grow flex flex-col">

            <!-- Visual Section -->
            <div id="visual-container"
                class="h-64 flex items-center justify-center bg-slate-100 rounded-xl mb-6 border border-slate-200 p-4">
                <!-- Visuals injected by JS -->
            </div>

            <!-- Text Section -->
            <div id="text-container" class="flex-grow">
                <!-- Text injected by JS -->
            </div>

        </div>

        <!-- Controls -->
        <div class="bg-slate-50 p-4 md:p-6 border-t border-slate-200 flex justify-between items-center">
            <button id="btn-back"
                class="px-6 py-2.5 rounded-lg font-medium text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400">
                &larr; Back
            </button>

            <div class="flex items-center space-x-2">
                <span id="step-indicator" class="text-sm font-semibold text-slate-500">Step 1 / 5</span>
                <div class="flex space-x-1" id="dots-container">
                    <!-- Dots injected by JS -->
                </div>
            </div>

            <button id="btn-next"
                class="px-6 py-2.5 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">
                Next &rarr;
            </button>
        </div>
    </div>

    <script src="../js/llm_foundation_model.js"></script>
</body>

</html>
