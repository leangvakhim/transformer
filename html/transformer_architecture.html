<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformer Architecture Visualizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX for rendering equations -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        /* Custom animations for smooth transitions */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .math-container {
            font-size: 1.25rem;
            overflow-x: auto;
        }

        /* Custom scrollbar for code block */
        .code-scroll::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }

        .code-scroll::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .code-scroll::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <!-- Main Container -->
    <div class="bg-white rounded-2xl shadow-xl max-w-6xl w-full flex flex-col overflow-hidden min-h-[700px]">

        <!-- Header -->
        <header class="bg-indigo-600 text-white p-6">
            <h1 class="text-3xl font-bold">Inside the Transformer</h1>
            <p class="text-indigo-200 mt-2">A step-by-step journey through the architecture powering modern LLMs.</p>
        </header>

        <!-- Content Area -->
        <div class="flex-grow p-8 flex flex-col md:flex-row gap-8 items-stretch relative">

            <!-- Text Description (Left) -->
            <div class="md:w-1/3 flex flex-col justify-start pt-4">
                <div class="inline-block bg-indigo-100 text-indigo-800 font-semibold px-3 py-1 rounded-full text-sm mb-4 w-max"
                    id="step-badge">
                    Step 1 of 7
                </div>
                <h2 class="text-2xl font-bold mb-4 text-gray-900" id="step-title">The Big Picture</h2>
                <div class="text-gray-600 leading-relaxed space-y-4 text-lg" id="step-desc">
                    <!-- Content injected by JS -->
                </div>

                <!-- Extra Resources Container (3 Buttons for Step 4, 5, 6) -->
                <div id="extra-resources" class="mt-8 flex flex-col space-y-3 hidden fade-in">
                    <button id="res-btn-1" onclick="window.open('./feedforward_residual.html', '_blank')"
                        class="hidden text-left px-4 py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg border border-blue-200 transition-colors text-sm font-medium items-center justify-between shadow-sm">
                        <span>Feed Forward & Residual Explanation</span>
                        <span>&rarr;</span>
                    </button>
                    <button id="res-btn-2" onclick="window.open('./output_generation.html', '_blank')"
                        class="hidden text-left px-4 py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg border border-blue-200 transition-colors text-sm font-medium items-center justify-between shadow-sm">
                        <span>Output Generation Explanation</span>
                        <span>&rarr;</span>
                    </button>
                    <button id="res-btn-3" onclick="window.open('./core_equation.html', '_blank')"
                        class="hidden text-left px-4 py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg border border-blue-200 transition-colors text-sm font-medium items-center justify-between shadow-sm">
                        <span>Core Equation Explanation</span>
                        <span>&rarr;</span>
                    </button>
                </div>
            </div>

            <!-- Visualizer Diagram (Right) -->
            <div class="md:w-2/3 bg-gray-50 rounded-xl border border-gray-200 p-6 flex items-center justify-center min-h-[400px]"
                id="step-visual">
                <!-- Visual injected by JS -->
            </div>

        </div>

        <!-- Footer / Navigation -->
        <footer class="border-t border-gray-200 p-6 bg-gray-50 flex justify-between items-center">
            <button id="btn-prev"
                class="px-6 py-2.5 rounded-lg font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; Previous
            </button>

            <div class="flex space-x-2" id="progress-dots">
                <!-- Dots injected by JS -->
            </div>

            <button id="btn-next"
                class="px-6 py-2.5 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 shadow hover:shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                Next Step &rarr;
            </button>
        </footer>
    </div>

    <script src="../js/transformer_architecture.js"></script>
</body>

</html>
