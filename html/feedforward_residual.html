<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformer: The AI Toy Factory</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

    <!-- KaTeX JS -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        /* Custom Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes convey {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(-100%);
            }
        }

        .conveyor-belt {
            overflow: hidden;
            white-space: nowrap;
        }

        .moving-toys {
            display: inline-block;
            animation: convey 5s linear infinite;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans p-4">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[800px] sm:h-[700px]">

        <!-- Header -->
        <div class="bg-indigo-600 text-white p-6">
            <h1 class="text-3xl font-bold flex items-center gap-3">
                <span>🏭</span> Transformer: The AI Toy Factory
            </h1>
            <p class="text-indigo-200 mt-2 text-sm sm:text-base">
                Step-by-step guide to Residual Connections and Feed Forward Networks.
            </p>

            <!-- Progress Bar -->
            <div class="mt-4 bg-indigo-800 rounded-full h-2 w-full overflow-hidden">
                <div id="progress-bar" class="bg-yellow-400 w-0 h-full transition-all duration-300"></div>
            </div>
            <p class="text-right text-xs mt-1 text-indigo-300" id="step-counter">Step 1 of X</p>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 p-6 sm:p-8 flex flex-col relative overflow-y-auto">

            <div id="content-container" class="flex-1 flex flex-col animate-fade-in">
                <!-- Visual Area -->
                <div id="visual-area"
                    class="h-48 sm:h-56 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center text-6xl mb-6 relative overflow-hidden">
                    <!-- Dynamic Visuals injected here -->
                </div>

                <!-- Text Area -->
                <div class="flex-1">
                    <h2 id="step-title" class="text-2xl font-bold text-slate-800 mb-3">Title</h2>
                    <p id="step-text" class="text-slate-600 leading-relaxed text-lg mb-6">
                        Description text goes here.
                    </p>
                </div>

                <!-- Formula Area -->
                <div id="formula-container" class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg hidden">
                    <p class="text-xs font-semibold text-blue-700 uppercase tracking-wider mb-2">The Math Behind It</p>
                    <div id="math-formula" class="text-center text-lg overflow-x-auto py-2"></div>
                </div>
            </div>

        </div>

        <!-- Navigation Controls -->
        <div class="bg-slate-50 p-4 sm:p-6 border-t border-slate-200 flex justify-between items-center">
            <button id="btn-back"
                class="px-6 py-2.5 rounded-lg font-medium transition-colors text-slate-600 bg-white border border-slate-300 hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed">
                ← Back
            </button>
            <button id="btn-next"
                class="px-6 py-2.5 rounded-lg font-medium transition-colors text-white bg-indigo-600 hover:bg-indigo-700 shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                Next Step →
            </button>
        </div>

    </div>

    <script src="../js/feedforward_residual.js"></script>
</body>

</html>
